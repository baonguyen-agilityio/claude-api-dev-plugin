name = "my-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret vars. Secrets FIREBASE_CLIENT_EMAIL and FIREBASE_PRIVATE_KEY are set per env with
# `wrangler secret put <NAME> --env <env>`, or in .dev.vars for local dev (docs: architecture §7).
[vars]
FIREBASE_PROJECT_ID = "your-firebase-project-id"
CORS_ORIGINS = "http://localhost:3000"

# Top-level binding serves `wrangler dev`. Bindings are not inherited: every env declares its own.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1000"
  [ratelimits.simple]
  limit = 100
  period = 60

[env.dev]
name = "dev-my-api"
vars = { FIREBASE_PROJECT_ID = "your-firebase-project-id-dev", CORS_ORIGINS = "https://app-dev.example.com" }
ratelimits = [{ name = "API_LIMITER", namespace_id = "1001", simple = { limit = 100, period = 60 } }]

[env.stag]
name = "stag-my-api"
vars = { FIREBASE_PROJECT_ID = "your-firebase-project-id-stag", CORS_ORIGINS = "https://app-stag.example.com" }
ratelimits = [{ name = "API_LIMITER", namespace_id = "1002", simple = { limit = 100, period = 60 } }]

[env.prod]
name = "prod-my-api"
vars = { FIREBASE_PROJECT_ID = "your-firebase-project-id-prod", CORS_ORIGINS = "https://app.example.com" }
ratelimits = [{ name = "API_LIMITER", namespace_id = "1003", simple = { limit = 100, period = 60 } }]

[observability.logs]
enabled = true
