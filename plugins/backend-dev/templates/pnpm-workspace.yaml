packages:
  - "apps/*"
  - "packages/*"
# One version per shared dependency for every package; bump it here.
catalog:
  "effect": 3.22.3
  "hono": 4.13.13
  "hono-openapi": 1.5.0
  "jose": 6.2.13
  "@cloudflare/workers-types": 5.20261019.1
  "@types/node": 22.20.5
  "typescript": 5.9.3
  "vitest": 3.2.4
  "@vitest/coverage-v8": 3.2.4
# esbuild and workerd fetch their platform binary in a postinstall step; wrangler needs both.
onlyBuiltDependencies:
  - esbuild
  - workerd
