name: Claude Code Review

# Reviews every pull request against this repo's own rules and fails the check when the verdict is NEEDS_CHANGES,
# so the review is a gate, not a comment to skim. CI (plugin-lint, template-gates) already covers what a script can
# check; this covers what needs reading.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          claude_args: '--allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*)"'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Review this pull request. This repo holds the backend-dev Claude Code plugin. Skills in
            plugins/backend-dev/skills/<skill>/SKILL.md and their references are instructions another Claude follows:
            review them as instructions, not as code. Hooks (plugins/backend-dev/hooks/) and scripts are Node code.
            Read CLAUDE.md first and check the change against every rule in it. Then check:
            - Every skill, file, script, command or tool a changed file refers to exists in this repo or is a standard
              Claude Code tool. A reference to something that only exists in another open pull request is blocking.
            - No two skills or references contradict each other, or the project profile format and guard rules in
              plugins/backend-dev/references/project-profile.md.
            - No skill tells Claude to read .dev.vars or .env, push to a protected branch, use --no-verify, force push,
              or add AI attribution, and anything a skill tells Claude to run is covered by its allowed-tools.
            - Anything a skill relies on that may be missing (a profile line, a CLI login, Chrome) has a stated fallback.
            - Outputs have a fixed shape (template, file name), so two runs give the same result.
            - Hooks and scripts never stop the user's work on their own failure, quote what they pass to a shell,
              and have a test for each changed behaviour.
            - A change in what users see or run comes with the README updated.
            - The pull request description says what changed and how it was checked (commands, real-session runs)
              and carries a review verdict. An empty description is blocking.
            Do not repeat what CI already checks (check-plugin lint, skill-validator, plugin validate, node tests,
            template gates).
            Write the review in English: first a one-line verdict (Ready to merge / Needs changes), then
            "Blocking" and "Minor" lists, each item with file and line. If there is nothing to flag, say so in one line.
            Any blocking item means Needs changes.
            End your final message with one line: "VERDICT:" then a space, then READY or NEEDS_CHANGES.
            The next CI step reads that line and fails the check on NEEDS_CHANGES.

      # A review that did not run must not pass silently. The one exception is a pull request that edits this
      # workflow: claude-code-action refuses to run a workflow file that differs from main's, so it cannot review it.
      - name: Fail when the review asks for changes or did not run
        if: always()
        env:
          OUT: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$OUT" ] || [ ! -f "$OUT" ]; then
            if gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | grep -qx '.github/workflows/claude-code-review.yml'; then
              echo "::notice::This pull request edits the review workflow, which the action will not run on. Review it by hand; the new review runs from the next pull request."
              exit 0
            fi
            echo "::error::The Claude review did not run (see the step above). Re-run this job; a pull request cannot pass without a review."
            exit 1
          fi
          verdict=$(jq -r '.. | strings' "$OUT" | grep -oE 'VERDICT: (READY|NEEDS_CHANGES)' | tail -1 || true)
          echo "${verdict:-no verdict found}"
          if [ "$verdict" != "VERDICT: READY" ]; then
            echo "::error::Claude review did not approve this pull request. Read its comment, fix the blocking items, push again."
            exit 1
          fi
