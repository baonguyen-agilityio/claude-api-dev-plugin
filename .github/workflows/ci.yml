name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node plugins/backend-dev/scripts/check-plugin.mjs
      - run: node --test plugins/backend-dev/hooks/*.test.mjs plugins/backend-dev/scripts/*.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@latest
      # typed-only skills carry Claude Code fields outside the spec (argument-hint, disable-model-invocation); every other skill stays fully strict
      - run: |
          for s in plugins/backend-dev/skills/*/; do
            x=; grep -qE '^(disable-model-invocation: true|user-invocable: false)' "$s/SKILL.md" && x=--allow-extra-frontmatter
            "$(go env GOPATH)/bin/skill-validator" check "$s" --strict $x -o compact
          done

  template-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: plugins/backend-dev/templates/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/backend-dev/templates/pnpm-lock.yaml
      - name: Gates on a clean copy of the template
        run: |
          tmp=$(mktemp -d) && cp -R plugins/backend-dev/templates/. "$tmp" && cd "$tmp"
          pnpm install --frozen-lockfile
          pnpm typecheck && pnpm test && pnpm check
      - name: Generator adds a module and gates stay green
        run: |
          tmp=$(mktemp -d) && cp -R plugins/backend-dev/templates/. "$tmp"
          node plugins/backend-dev/scripts/new-module.mjs "$tmp/apps/api" tags tag
          cd "$tmp" && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
