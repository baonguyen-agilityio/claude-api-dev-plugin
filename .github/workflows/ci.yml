name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node plugins/backend-dev/scripts/check-plugin.mjs
      - run: node --test plugins/backend-dev/hooks/*.test.mjs plugins/backend-dev/scripts/*.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@latest
      - run: for s in plugins/backend-dev/skills/*/; do "$(go env GOPATH)/bin/skill-validator" check "$s" --strict -o compact; done

  template-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/backend-dev/templates/package-lock.json
      - name: Gates on a clean copy of the template
        run: |
          tmp=$(mktemp -d) && cp -R plugins/backend-dev/templates/. "$tmp" && cd "$tmp"
          npm ci
          npm run typecheck && npm test && npm run check
      - name: Generator adds a module and gates stay green
        run: |
          tmp=$(mktemp -d) && cp -R plugins/backend-dev/templates/. "$tmp"
          node plugins/backend-dev/scripts/new-module.mjs "$tmp" tags tag
          cd "$tmp" && npm ci && npm run typecheck && npm test
